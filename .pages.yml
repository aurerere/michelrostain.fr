media:
  input: public/media
  output: /media

content:
  - name: books
    label: Livres
    type: group
    items:
      - name: published_book
        label: Livres publiés
        type: collection
        path: src/data/books
        fields:
          - name: kind
            label: Type
            type: select
            options:
              values:
                - name: novel
                  label: Roman
                - name: essay
                  label: Essai
          - name: title
            label: Titre
            type: string
          - name: covers
            label: Couvertures
            type: image
            options:
              multiple:
                max: 2
              unique: true
              extensions: [jpg, png, webp]
              rename: true
          - name: authors
            label: Auteur(s)
            list: true
            type: string
          - name: publish_at
            label: Date de publication
            type: date
            options:
              time: false
          - name: publisher
            label: Éditeur
            type: string
          - name: isbn
            label: ISBN
            type: string
          - name: notes
            label: Notes
            type: rich-text
      - name: novels
        label: Introduction aux romans
        type: file
        path: src/content/pages/novels.md
        fields:
          - name: body
            label: Contenu
            type: rich-text