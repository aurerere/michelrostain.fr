media:
  input: public/media
  output: /media

content:
  - name: books
    label: Livres
    type: group
    items:
      - name: published_book
        label: Livres publiés
        type: collection
        path: src/data/books
        view: [title]
        fields:
          - name: kind
            label: Type
            type: select
            options:
              values:
                - name: novel
                  label: Roman
                - name: essay
                  label: Essai
          - name: title
            label: Titre
            type: string
          - name: authors
            label: Auteur(s)
            list: true
            type: string
          - name: publish_at
            label: Date de publication
            type: date
            options:
              time: false
          - name: publisher
            label: Éditeur
            type: string
          - name: isbn
            label: ISBN
            type: string
          - name: notes
            label: Notes
            type: rich-text
      - name: novels
        label: Romans
        type: file
        path: src/content/pages/novels.md
        fields:
          - name: body
            label: Contenu
            type: rich-text
      - name: essays
        label: Essais
        type: file
        path: srs/content/pages/essays.md
        fields:
          - name: body
            label: Contenu
            type: rich-text
